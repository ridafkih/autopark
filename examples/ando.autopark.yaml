# yaml-language-server: $schema=../schema/autopark.schema.json
# Example: Ando's monorepo. Copy to .autopark.yaml at the repo root and adjust.
repos:
  - Ando-Corporation/ando

track:
  authors: ["@me"]
  branchPrefixes: ["worm/"]

checks:
  useGitHubRequired: true
  required: ["Merge Ready"]
  humanGates: ["Ando Automated Review"]

reviewers:
  - name: greptile
    parser: greptile
    minScore: 5

readiness:
  noUnresolvedThreads: true
  countOutdatedThreads: true
  approvalOnHead: true
  minApprovals: 1
  noConflict: true
  baseFreshness:
    policy: contains-tip

notify:
  - type: command
    command: osascript -e "display notification \"$AUTOPARK_REASON\" with title \"#$AUTOPARK_NUMBER $AUTOPARK_KIND\""
    on: [ready, conflicted, checks_failed, merged]

autoMerge:
  labels: ["autopark:automerge"]
  method: squash

reviewRequest:
  instruction: >-
    Ask Cortana for approval of {url} in #pr-approvals using the ando-channel tools.
    One short message with the link; re-ask whenever the head moves.

# Re-announce stuck PRs to the driving session until they are ready, merged or held.
# kinds defaults to every blocking reason except draft, awaiting_human included.
nudge:
  after: 10m
  every: 10m
  escalateAfter: 30m

standards:
  files: [CLAUDE.md, AGENTS.md]
  skills: [vercel-composition-patterns]

hooks:
  stop:
    scope: session
    blockOnHeadMovedWithoutReview: true

daemon:
  source:
    type: gh-webhook-forward
  port: 8787
